services:
  app_proxy:
    environment:
      APP_HOST: temps-community-temps_bridge_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  installer:
    image: alpine:3.22
    user: "0:0"
    privileged: true
    pid: host
    network_mode: host
    restart: "no"
    volumes:
      - /:/host
      - ${APP_DATA_DIR}/data:/state
      - ${APP_DATA_DIR}/bootstrap.sh:/bootstrap.sh:ro
    entrypoint:
      - /bin/sh
      - /bootstrap.sh

  bridge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      installer:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
