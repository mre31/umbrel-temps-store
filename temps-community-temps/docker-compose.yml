version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: temps-community-temps_server_1
      APP_PORT: 9000
      # Temps has its own login. Umbrel auth stays enabled as an additional layer.

  secrets-init:
    image: alpine:3.22
    restart: "no"
    environment:
      APP_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data/secrets:/secrets
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /secrets
        if [ ! -s /secrets/admin-password ]; then
          printf '%s\n' "$$APP_PASSWORD" > /secrets/admin-password
        fi
        chmod 600 /secrets/admin-password

  postgres:
    image: gotempsh/timescaledb-walg:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: temps
      POSTGRES_USER: temps
      POSTGRES_PASSWORD: "${APP_SEED}pg"
      TIMESCALEDB_TELEMETRY: "off"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >-
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_timeout=60
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD='${APP_SEED}pg' psql -h 127.0.0.1 -U temps -d temps -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - temps-control

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.5.10-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: temps
      CLICKHOUSE_USER: temps
      CLICKHOUSE_PASSWORD: "${APP_SEED}ch"
    volumes:
      - ${APP_DATA_DIR}/data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "temps", "--password", "${APP_SEED}ch", "--database", "temps", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - temps-control

  server:
    image: ghcr.io/gotempsh/temps:latest
    # Temps needs access to the host Docker daemon to build and run deployments.
    # Docker socket access is already root-equivalent; running as root avoids a
    # host-specific docker.sock group-ID dependency on Umbrel.
    user: "0:0"
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      TEMPS_EXECUTION_ENV: docker
      TEMPS_NETWORK_NAME: temps-community-temps-workloads
      TEMPS_DATABASE_URL: "postgresql://temps:${APP_SEED}pg@postgres:5432/temps"
      TEMPS_ADDRESS: "0.0.0.0:3000"
      TEMPS_CONSOLE_ADDRESS: "0.0.0.0:9000"
      TEMPS_DATA_DIR: /app/data
      TEMPS_ADMIN_EMAIL: "admin@umbrel.local"
      TEMPS_ADMIN_PASSWORD_FILE: /run/temps-secrets/admin-password
      TEMPS_LOG_LEVEL: info
      TEMPS_CLICKHOUSE_URL: "http://clickhouse:8123"
      TEMPS_CLICKHOUSE_DATABASE: temps
      TEMPS_CLICKHOUSE_USER: temps
      TEMPS_CLICKHOUSE_PASSWORD: "${APP_SEED}ch"
      TEMPS_DISABLE_HTTPS_REDIRECT: "true"
    command: ["serve", "--disable-https-redirect"]
    volumes:
      - ${APP_DATA_DIR}/data/temps:/app/data
      - ${APP_DATA_DIR}/data/secrets:/run/temps-secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Public HTTP ingress for deployed apps. Keep 80/443 free for Umbrel.
    ports:
      - "9080:3000"
      - "9081:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - temps-control
      - temps-workloads

networks:
  temps-control:
    driver: bridge
    internal: true
  temps-workloads:
    name: temps-community-temps-workloads
    driver: bridge
