manifestVersion: 1
id: temps-community-temps
name: Temps
tagline: Self-hosted Vercel-style deployment platform
description: >-
  Temps is an open-source self-hosted deployment platform for Git-based deployments,
  preview environments, managed services, analytics, error tracking, session replay,
  and application routing. This Umbrel package installs Temps on the Umbrel host using
  the official Temps installer, then exposes its console through Umbrel's app proxy.
  Temps itself runs natively under systemd rather than being repackaged as an Umbrel
  container.
category: Development
version: 0.2.0-umbrel.1
port: 39291
icon: https://temps.sh/favicon.ico
developer: Temps Contributors
website: https://temps.sh
repo: https://github.com/gotempsh/temps
support: https://github.com/gotempsh/temps/issues
releaseNotes: >-
  Switch to the official host installer architecture. Installs a pinned Temps release
  with the reviewed official deploy script, keeps Umbrel ports 80/443 untouched, and
  proxies the native Temps console into the Umbrel UI.
dependencies: []
path: ""
defaultUsername: admin@temps.local
submitter: Community
