events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream temps_console {
    # Native host listener configured by bootstrap.sh.
    server host.docker.internal:9081 max_fails=2 fail_timeout=2s;

    # Fallback for an upstream installer/service that keeps the default listener.
    server host.docker.internal:3000 backup;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      proxy_pass http://temps_console;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
